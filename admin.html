<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNA JHB Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ef;--card:#fff;--border:#e2ddd6;--text:#1a1714;--muted:#7a756e;--accent:#c8402a;--accent-light:#fdf0ed;--accent-dark:#9e3220;--green:#2a7a4b;--green-light:#edf7f2;--radius:12px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}
header{background:var(--text);color:#fff;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;}
.logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;}
.logo span{color:var(--accent);}
.header-right{display:flex;align-items:center;gap:10px;}
.admin-badge{font-size:11px;background:var(--accent);padding:3px 8px;border-radius:20px;font-weight:500;}
.nav-link{color:#fff;opacity:.7;font-size:13px;text-decoration:none;}
.nav-link:hover{opacity:1;}
.tabs{background:var(--card);border-bottom:2px solid var(--border);display:flex;padding:0 16px;}
.tab{padding:14px 18px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit;display:flex;align-items:center;gap:6px;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;min-width:18px;text-align:center;}
.badge-red{background:var(--accent);color:#fff;}
.badge-green{background:var(--green);color:#fff;}
.tab-content{display:none;}.tab-content.active{display:block;}
.container{max-width:1000px;margin:0 auto;padding:20px 16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.card-title{font-size:14px;font-weight:600;margin-bottom:14px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:500px){.form-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:4px;}.field.full{grid-column:1/-1;}
.field label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
input[type=text],input[type=number],textarea,.fselect{padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;width:100%;}
input:focus,textarea:focus,.fselect:focus{border-color:var(--accent);background:#fff;}
textarea{resize:vertical;min-height:60px;}
.fselect{cursor:pointer;}
#p-cat-new{display:none;margin-top:8px;}
.img-upload{border:2px dashed var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;background:var(--bg);}
.img-upload:hover{border-color:var(--accent);}
.img-upload input{display:none;}
.img-preview{width:68px;height:68px;object-fit:cover;border-radius:8px;margin:0 auto 8px;display:block;}
.upload-text{font-size:12px;color:var(--muted);}
.btn{padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border:none;display:inline-flex;align-items:center;gap:5px;}
.btn-red{background:var(--accent);color:#fff;}.btn-red:hover{background:var(--accent-dark);}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:inherit;}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.btn-edit{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:inherit;margin-right:4px;}
.btn-edit:hover{border-color:var(--text);color:var(--text);}
.btn-picking{background:var(--text);color:#fff;font-size:12px;padding:7px 14px;border-radius:6px;cursor:pointer;font-family:inherit;border:none;display:inline-flex;align-items:center;gap:5px;}
.save-msg{font-size:13px;color:var(--green);font-weight:500;margin-top:8px;display:none;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#faf9f7;}
.price-cell{font-family:"DM Mono",monospace;font-weight:500;color:var(--accent);}
.rrp-cell{font-family:"DM Mono",monospace;color:var(--muted);}
.code-cell{font-family:"DM Mono",monospace;font-size:11px;color:var(--muted);}
.cat-pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;background:var(--accent-light);color:var(--accent);}
.thumb{width:36px;height:36px;object-fit:cover;border-radius:6px;display:block;border:1px solid var(--border);}
.thumb-ph{width:36px;height:36px;border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid var(--border);}
.row-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.count-badge{font-size:12px;background:var(--bg);border:1px solid var(--border);padding:3px 10px;border-radius:20px;color:var(--muted);}
.empty-box{text-align:center;padding:40px;color:var(--muted);}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.search-input{padding:8px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;}
.search-input:focus{border-color:var(--accent);}
.filter-select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;cursor:pointer;}
.order-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.order-card-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;gap:8px;}
.order-card-header:hover{background:#faf9f7;}
.order-franchise{font-weight:600;font-size:15px;}
.order-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.order-total-units{font-family:"DM Mono",monospace;font-weight:700;color:var(--text);font-size:16px;}
.order-lines-count{font-size:11px;color:var(--muted);margin-top:3px;}
.chevron{font-size:11px;color:var(--muted);margin-left:5px;display:inline-block;transition:transform .2s;}
.chevron.open{transform:rotate(180deg);}
.order-detail{display:none;border-top:1px solid var(--border);}.order-detail.open{display:block;}
.order-detail table{font-size:13px;}
.order-actions{padding:12px 16px;display:flex;gap:8px;border-top:1px solid var(--border);background:var(--bg);flex-wrap:wrap;}
.new-dot{width:7px;height:7px;background:var(--green);border-radius:50%;display:inline-block;margin-right:5px;}
.orders-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.backup-bar{background:var(--green-light);border:1px solid var(--green);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.backup-bar-text{font-size:13px;color:var(--green);font-weight:500;flex:1;}
.backup-status{font-size:12px;color:var(--green);margin-top:4px;display:none;}
.sync-btn{background:var(--green);color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.sync-btn:hover{opacity:.9;}
.sync-btn:disabled{opacity:.5;cursor:default;}
.restore-btn{background:none;border:1px solid var(--green);color:var(--green);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
</style>
</head>

let imgData = '', editId = null;

function handleCatChange(sel) {
  const inp = document.getElementById('p-cat-new');
  if(sel.value === '__new__') {
    inp.style.display = 'block';
    inp.focus();
  } else {
    inp.style.display = 'none';
  }
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
  document.querySelector('.tab[onclick*="' + name + '"]').classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if(name === 'orders') { renderOrders(); autoFetchOrders(); }
}

function previewImg(inp) {
  if(!inp.files || !inp.files[0]) return;
  const r = new FileReader();
  r.onload = function(e) {
    imgData = e.target.result;
    const p = document.getElementById('img-preview');
    p.src = imgData; p.style.display = 'block';
    document.getElementById('upload-text').style.display = 'none';
  };
  r.readAsDataURL(inp.files[0]);
}

function saveProduct() {
  const code = document.getElementById('p-code').value.trim();
  const name = document.getElementById('p-name').value.trim();
  let cat = document.getElementById('p-cat').value;
  const price = parseFloat(document.getElementById('p-price').value) || 0;
  const rrp = parseFloat(document.getElementById('p-rrp').value) || 0;
  const desc = document.getElementById('p-desc').value.trim();

  if(cat === '__new__') {
    cat = document.getElementById('p-cat-new').value.trim();
    if(!cat) { alert('Please type a name for the new category.'); return; }
    const sel = document.getElementById('p-cat');
    if(![...sel.options].some(function(o) { return o.value === cat; })) {
      const opt = document.createElement('option');
      opt.value = cat; opt.textContent = cat;
      sel.appendChild(opt);
      const fc = document.getElementById('filter-cat');
      if(fc) {
        const fo = document.createElement('option');
        fo.value = cat; fo.textContent = cat;
        fc.appendChild(fo);
      }
    }
    sel.value = cat;
    document.getElementById('p-cat-new').style.display = 'none';
    document.getElementById('p-cat-new').value = '';
    if(!CATEGORIES.includes(cat)) { CATEGORIES.push(cat); CATEGORIES.sort(); }
  }

  if(!code || !name || !cat) { alert('Please fill in code, name and category.'); return; }

  if(editId) {
    const idx = products.findIndex(function(p) { return p.id === editId; });
    if(idx !== -1) products[idx] = Object.assign(products[idx], {code, name, category:cat, price, rrp, description:desc, image:imgData||products[idx].image});
    editId = null;
    document.getElementById('form-title').textContent = '+ Add new product';
  } else {
    const newP = {id: cat.substring(0,3).toUpperCase() + '-' + code, code, name, category:cat, price, rrp, description:desc, image:imgData};
    products.push(newP);
    // Save to extra_products so ordering portal picks it up
    const extra = JSON.parse(localStorage.getItem('pna_extra_products') || '[]');
    const noImage = Object.assign({}, newP, {image:''});
    if(!extra.some(function(p) { return p.id === newP.id; })) {
      extra.push(noImage);
      localStorage.setItem('pna_extra_products', JSON.stringify(extra));
    }
    localStorage.removeItem('pna_last_sheet_check');
  }
  localStorage.setItem('pna_products', JSON.stringify(products));
  resetForm();
  document.getElementById('save-msg').style.display = 'block';
  document.getElementById('save-msg').textContent = '\u2705 Saved! Syncing...';
  pushProductChange(products).then(function() {
    document.getElementById('save-msg').textContent = '\u2705 Saved and synced to Google Sheets!';
    setTimeout(function() { document.getElementById('save-msg').style.display='none'; }, 3000);
  }).catch(function() {
    document.getElementById('save-msg').textContent = '\u2705 Saved locally. Sync when online.';
    setTimeout(function() { document.getElementById('save-msg').style.display='none'; }, 3000);
  });
  renderTable();
}

function resetForm() {
  ['p-code','p-name','p-price','p-rrp','p-desc'].forEach(function(id) { document.getElementById(id).value=''; });
  document.getElementById('img-preview').style.display = 'none';
  document.getElementById('upload-text').style.display = 'block';
  document.getElementById('p-image').value = '';
  document.getElementById('p-cat-new').style.display = 'none';
  document.getElementById('p-cat-new').value = '';
  document.getElementById('p-cat').value = CATEGORIES[0] || '__new__';
  imgData = ''; editId = null;
  document.getElementById('form-title').textContent = '+ Add new product';
}

function editProduct(id) {
  const p = products.find(function(x) { return x.id === id; });
  if(!p) return;
  editId = id;
  document.getElementById('p-code').value = p.code;
  document.getElementById('p-name').value = p.name;
  const sel = document.getElementById('p-cat');
  if([...sel.options].some(function(o) { return o.value === p.category; })) {
    sel.value = p.category;
  } else {
    const opt = document.createElement('option');
    opt.value = p.category; opt.textContent = p.category;
    sel.appendChild(opt);
    sel.value = p.category;
  }
  document.getElementById('p-price').value = p.price || '';
  document.getElementById('p-rrp').value = p.rrp || '';
  document.getElementById('p-desc').value = p.description || '';
  if(p.image) { imgData=p.image; const pr=document.getElementById('img-preview'); pr.src=p.image; pr.style.display='block'; document.getElementById('upload-text').style.display='none'; }
  document.getElementById('form-title').textContent = '\u270F Edit product';
  window.scrollTo({top:0, behavior:'smooth'});
  switchTab('products');
}

function deleteProduct(id) {
  if(!confirm('Delete this product? This is permanent.')) return;
  products = products.filter(function(p) { return p.id !== id; });
  localStorage.setItem('pna_products', JSON.stringify(products));
  // Track deletion so ordering portal removes it
  const deleted = JSON.parse(localStorage.getItem('pna_deleted_ids') || '[]');
  if(!deleted.includes(id)) deleted.push(id);
  localStorage.setItem('pna_deleted_ids', JSON.stringify(deleted));
  // Remove from extra_products
  const extra = JSON.parse(localStorage.getItem('pna_extra_products') || '[]');
  localStorage.setItem('pna_extra_products', JSON.stringify(extra.filter(function(p) { return p.id !== id; })));
  localStorage.removeItem('pna_last_sheet_check');
  renderTable();
  pushProductChange(products);
}

function renderTable() {
  const q = document.getElementById('prod-search').value.toLowerCase();
  const catFilter = document.getElementById('filter-cat').value;
  const list = products.filter(function(p) {
    return (!catFilter || p.category === catFilter) && (!q || p.name.toLowerCase().includes(q) || p.code.includes(q));
  });
  document.getElementById('prod-count').textContent = products.length + ' products';
  document.getElementById('prod-badge').textContent = products.length;
  const el = document.getElementById('prod-table');
  if(!list.length) { el.innerHTML = '<div class="empty-box">No products found.</div>'; return; }
  el.innerHTML = '<table><thead><tr><th></th><th>Code</th><th>Name</th><th>Category</th><th>Sell price</th><th>RRP</th><th></th></tr></thead><tbody>'
    + list.map(function(p) {
        return '<tr>'
          + '<td>' + (p.image ? '<img class="thumb" src="'+p.image+'" alt="'+p.name+'"/>' : '<div class="thumb-ph">&#x1F4E6;</div>') + '</td>'
          + '<td class="code-cell">' + p.code + '</td>'
          + '<td style="font-weight:500;max-width:200px;">' + p.name + '</td>'
          + '<td><span class="cat-pill">' + p.category + '</span></td>'
          + '<td class="price-cell">' + (p.price>0?'R'+parseFloat(p.price).toFixed(2):'&mdash;') + '</td>'
          + '<td class="rrp-cell">' + (p.rrp>0?'R'+parseFloat(p.rrp).toFixed(2):'&mdash;') + '</td>'
          + '<td style="white-space:nowrap;"><button class="btn-edit" onclick="editProduct(''+p.id+'')">Edit</button><button class="btn-ghost" onclick="deleteProduct(''+p.id+'')">Delete</button></td>'
          + '</tr>';
      }).join('') + '</tbody></table>';
}

function pushProductChange(prods) {
  const stripped = prods.map(function(p) {
    return {id:p.id, code:p.code, name:p.name, category:p.category, price:p.price||0, rrp:p.rrp||0, description:p.description||''};
  });
  const BATCH = 200;
  const batches = [];
  for(let i=0; i<stripped.length; i+=BATCH) batches.push(stripped.slice(i,i+BATCH));
  let chain = Promise.resolve();
  batches.forEach(function(batch, i) {
    chain = chain.then(function() {
      return fetch(SCRIPT_URL, {method:'POST', body:JSON.stringify({action:'saveProducts', products:batch, batchNum:i+1, totalBatches:batches.length, clearFirst:i===0})}).then(function(r){ return r.json(); });
    });
  });
  return chain;
}

function syncProductsToSheet() {
  const btn = document.getElementById('sync-products-btn');
  const status = document.getElementById('backup-status');
  btn.disabled = true;
  status.style.display = 'block';
  status.textContent = 'Backing up...';
  const stripped = products.map(function(p) {
    return {id:p.id, code:p.code, name:p.name, category:p.category, price:p.price||0, rrp:p.rrp||0, description:p.description||''};
  });
  const BATCH = 200; const batches = [];
  for(let i=0; i<stripped.length; i+=BATCH) batches.push(stripped.slice(i,i+BATCH));
  let sent = 0;
  let chain = Promise.resolve();
  batches.forEach(function(batch, i) {
    chain = chain.then(function() {
      status.textContent = 'Backing up... ' + sent + ' / ' + stripped.length;
      return fetch(SCRIPT_URL, {method:'POST', body:JSON.stringify({action:'saveProducts', products:batch, batchNum:i+1, totalBatches:batches.length, clearFirst:i===0})}).then(function(r){ return r.json(); }).then(function() { sent += batch.length; });
    });
  });
  chain.then(function() {
    status.textContent = '\u2705 ' + stripped.length + ' products backed up!';
    btn.textContent = '\u2705 Done!';
    setTimeout(function() { btn.textContent='\u2601 Backup to Sheet'; btn.disabled=false; status.style.display='none'; }, 3000);
  }).catch(function() {
    status.textContent = '\u274C Backup failed.';
    btn.disabled = false;
  });
}

function restoreProductsFromSheet() {
  const btn = document.getElementById('restore-products-btn');
  btn.textContent = 'Restoring...';
  fetch(SCRIPT_URL + '?action=getProducts').then(function(r){ return r.json(); }).then(function(data) {
    if(data.status==='ok' && data.products && data.products.length) {
      products = data.products;
      localStorage.setItem('pna_products', JSON.stringify(products));
      renderTable();
      btn.textContent = '\u2705 ' + products.length + ' restored!';
      setTimeout(function() { btn.textContent='\u21BA Restore from Sheet'; }, 3000);
    } else {
      btn.textContent = '\u274C Nothing found';
      setTimeout(function() { btn.textContent='\u21BA Restore from Sheet'; }, 3000);
    }
  }).catch(function() { btn.textContent='\u274C Failed'; setTimeout(function(){btn.textContent='\u21BA Restore from Sheet';},3000); });
}

function renderOrders() {
  const orders = JSON.parse(localStorage.getItem('pna_orders') || '[]');
  document.getElementById('orders-count').textContent = orders.length + ' order' + (orders.length!==1?'s':'');
  document.getElementById('order-badge').textContent = orders.length;
  const el = document.getElementById('orders-list');
  if(!orders.length) { el.innerHTML = '<div class="empty-box">No orders yet. Click Sync to load from Google Sheets.</div>'; return; }
  el.innerHTML = [...orders].reverse().map(function(o, i) {
    const items = Array.isArray(o.items) ? o.items : [];
    const ref = o.orderRef || ('ORD-' + String(o.id||i).slice(-6));
    const totalUnits = items.reduce(function(s,it){ return s+it.qty; }, 0);
    const cats = [...new Set(items.map(function(it){ return it.category; }))];
    return '<div class="order-card">'
      + '<div class="order-card-header" onclick="toggleOrder('o'+i+'')">'
      + '<div><div class="order-franchise"><span class="new-dot"></span>' + o.franchiseName + '</div>'
      + '<div class="order-meta">' + ref + ' &nbsp;&middot;&nbsp; ' + o.date + '</div>'
      + '<div class="order-meta">' + cats.join(', ') + '</div>'
      + (o.notes?'<div class="order-meta" style="color:var(--accent);">'+o.notes+'</div>':'')
      + '</div>'
      + '<div style="text-align:right;flex-shrink:0;"><div class="order-total-units">' + totalUnits + ' units</div>'
      + '<div class="order-lines-count">' + items.length + ' lines <span class="chevron" id="chev-o'+i+'">&#x25BC;</span></div></div>'
      + '</div>'
      + '<div class="order-detail" id="od-o'+i+'">'
      + '<table><thead><tr><th>Code</th><th>Description</th><th>Category</th><th>Qty</th><th>RRP</th></tr></thead><tbody>'
      + items.map(function(it) {
          return '<tr><td class="code-cell">'+it.code+'</td><td style="font-weight:500;">'+it.name+'</td><td><span class="cat-pill">'+it.category+'</span></td><td style="font-family:DM Mono,monospace;font-weight:700;">'+it.qty+'</td><td class="rrp-cell">'+(it.rrp>0?'R'+parseFloat(it.rrp).toFixed(2):'&mdash;')+'</td></tr>';
        }).join('')
      + '</tbody></table>'
      + '<div class="order-actions"><button class="btn-picking" onclick="printPickingSlip('+i+')">&#x1F5A8; Picking Slip</button><button class="btn-ghost" onclick="deleteOrder(''+( o.id||i)+'')">Delete</button></div>'
      + '</div></div>';
  }).join('');
}

function autoFetchOrders() {
  fetch(SCRIPT_URL + '?action=getOrders').then(function(r){ return r.json(); }).then(function(data) {
    if(data.status==='ok' && data.orders && data.orders.length) {
      localStorage.setItem('pna_orders', JSON.stringify(data.orders));
      renderOrders();
    }
  }).catch(function(){});
}

function syncFromSheet() {
  const s = document.getElementById('sync-status');
  s.style.display='block'; s.textContent='Fetching from Google Sheets...';
  fetch(SCRIPT_URL + '?action=getOrders').then(function(r){ return r.json(); }).then(function(data) {
    if(data.status==='ok' && data.orders) {
      localStorage.setItem('pna_orders', JSON.stringify(data.orders));
      renderOrders();
      s.textContent = '\u2705 ' + data.orders.length + ' orders loaded.';
    } else { s.textContent = 'No orders found.'; }
    setTimeout(function(){ s.style.display='none'; }, 3000);
  }).catch(function(){ s.textContent='\u274C Could not connect.'; });
}

function toggleOrder(id) {
  document.getElementById('od-'+id).classList.toggle('open');
  document.getElementById('chev-'+id).classList.toggle('open');
}

function printPickingSlip(idx) {
  const orders = [...JSON.parse(localStorage.getItem('pna_orders')||'[]')].reverse();
  const o = orders[idx]; if(!o) return;
  const items = Array.isArray(o.items)?o.items:[];
  const ref = o.orderRef||('ORD-'+String(o.id||idx).slice(-6));
  const cats = [...new Set(items.map(function(it){ return it.category; }))];
  let tableRows = '';
  cats.forEach(function(cat) {
    const catItems = items.filter(function(it){ return it.category===cat; });
    tableRows += '<tr style="background:#f5f3ef;"><td colspan="4" style="padding:8px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#7a756e;border:1px solid #ddd;">'+cat+'</td></tr>';
    catItems.forEach(function(it,i) {
      tableRows += '<tr style="background:'+(i%2===0?'#fff':'#faf9f7')+';">'
        + '<td style="padding:8px 10px;border:1px solid #ddd;font-family:monospace;font-size:12px;">'+it.code+'</td>'
        + '<td style="padding:8px 10px;border:1px solid #ddd;font-weight:500;">'+it.name+'</td>'
        + '<td style="padding:8px 10px;border:1px solid #ddd;text-align:center;font-weight:700;font-size:16px;">'+it.qty+'</td>'
        + '<td style="padding:8px 10px;border:1px solid #ddd;text-align:center;width:60px;"><span style="display:inline-block;width:40px;height:20px;border:1px solid #999;border-radius:3px;"></span></td>'
        + '</tr>';
    });
  });
  const totalUnits = items.reduce(function(s,it){ return s+it.qty; },0);
  const w = window.open('','_blank');
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Picking Slip '+ref+'</title>'
    + '<style>body{font-family:Arial,sans-serif;padding:24px;color:#1a1714;font-size:13px;}'
    + '.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:16px;border-bottom:3px solid #1a1714;}'
    + '.company{font-size:24px;font-weight:700;color:#c8402a;}'
    + '.meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;background:#f5f3ef;padding:14px;border-radius:8px;}'
    + '.meta-item label{font-size:10px;font-weight:600;text-transform:uppercase;color:#7a756e;display:block;margin-bottom:3px;}'
    + '.meta-item span{font-size:13px;font-weight:600;}'
    + 'table{width:100%;border-collapse:collapse;margin-bottom:20px;}'
    + 'thead{background:#1a1714;color:#fff;}'
    + 'thead th{padding:10px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;}'
    + 'tfoot td{padding:10px;font-weight:700;font-size:13px;border-top:3px solid #1a1714;}'
    + '.sig-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px;}'
    + '.sig-box{border:1px solid #ddd;border-radius:6px;padding:10px 16px;text-align:center;font-size:11px;color:#7a756e;}'
    + '.sig-line{border-bottom:1px solid #999;height:32px;margin-bottom:4px;}'
    + '@media print{@page{margin:15mm;}}'
    + '</style></head><body>'
    + '<div class="header"><div><div class="company">PNA JHB</div><div style="font-size:12px;color:#7a756e;">Franchise Stock Orders</div></div>'
    + '<div style="text-align:right;"><div style="font-size:20px;font-weight:700;color:#c8402a;text-transform:uppercase;">Picking Slip</div><div style="font-size:12px;color:#7a756e;">'+ref+'</div></div></div>'
    + '<div class="meta-grid">'
    + '<div class="meta-item"><label>Franchise</label><span>'+o.franchiseName+'</span></div>'
    + '<div class="meta-item"><label>Date</label><span>'+o.date+'</span></div>'
    + '<div class="meta-item"><label>Ref</label><span>'+ref+'</span></div>'
    + '<div class="meta-item"><label>Total units</label><span>'+totalUnits+'</span></div>'
    + '</div>'
    + '<table><thead><tr><th>Code</th><th>Description</th><th>Qty to pick</th><th>Picked \u2713</th></tr></thead>'
    + '<tbody>'+tableRows+'</tbody>'
    + '<tfoot><tr><td colspan="2" style="text-align:right;">Total units</td><td colspan="2">'+totalUnits+'</td></tr></tfoot>'
    + '</table>'
    + '<div class="sig-grid"><div class="sig-box"><div class="sig-line"></div>Picked by</div><div class="sig-box"><div class="sig-line"></div>Checked by</div><div class="sig-box"><div class="sig-line"></div>Dispatched by</div></div>'
    + '</body></html>');
  w.document.close();
  w.onload = function(){ w.print(); };
}

function deleteOrder(id) {
  if(!confirm('Delete this order?')) return;
  let orders = JSON.parse(localStorage.getItem('pna_orders')||'[]');
  orders = orders.filter(function(o,i){ return String(o.id||i) !== String(id); });
  localStorage.setItem('pna_orders', JSON.stringify(orders));
  renderOrders();
}

function clearOrders() {
  if(!confirm('Clear all orders?')) return;
  localStorage.removeItem('pna_orders');
  renderOrders();
}

window.addEventListener('storage', function(e){ if(e.key==='pna_orders') renderOrders(); });
renderTable();
renderOrders();
setTimeout(function(){ autoFetchOrders(); }, 1000);
</script>
</body>
</html>
